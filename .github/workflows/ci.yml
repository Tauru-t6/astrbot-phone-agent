name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile plugin modules
        run: python -m py_compile main.py model_planning.py device_app.py device_fleet.py ui_task.py task_runner.py care_scheduler.py storage.py health_connect.py location_bridge.py http_transport.py companion-context/main.py companion-context/v2_adapter.py deploy/relay/relay_server.py
      - name: Validate configuration JSON
        run: python -m json.tool _conf_schema.json >/dev/null && python -m json.tool companion-context/_conf_schema.json >/dev/null
      - name: Install test dependencies
        run: python -m pip install quart pytest
      - name: Run plugin and relay tests
        run: python -m pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run dashboard regression tests
        run: node --test tests/test_dashboard.js

name: astrbot_plugin_phone_agent
display_name: Phone Control
author: tauru
description: |
  AstrBot 手机控制插件：支持逐步核验的手机任务、页面结果回传、参数化收藏、接手续跑和限额 Bot 日程；可选扫码配对与截图辅助。个人版保留健康同步、提醒与夜间守护。
  Verified phone tasks for AstrBot with grounded results, reusable templates, fresh approval on resume, bounded Bot schedules, optional device pairing and screenshot assistance. Personal health sync and reminders remain available.
version: 0.11.0
astrbot_version: ">=4.22.0"
support_platforms:
  - aiocqhttp
  - qq_official
repo: https://github.com/Tauru-t6/astrbot-phone-agent
pages:
  - name: phone-control
    title: Phone Control
